server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Max body size (exports + webhook payloads).
    client_max_body_size 10m;

    # --- API + backend passthrough (same-origin) ---
    # The SPA calls /api/* relative to its own origin; nginx proxies to the api
    # container over the compose network. Same-origin means no CORS and the
    # httpOnly refresh cookie works. StackForge's outer nginx fronts this single
    # port. X-Forwarded-* preserved so the API sees the real client IP (Pluggy
    # webhook source-IP check via ASP.NET ForwardedHeaders).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hangfire {
        proxy_pass http://api:8080/hangfire;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA (react-router) — deep links fall back to index.html ---
    location / {
        try_files $uri /index.html;
    }
}
